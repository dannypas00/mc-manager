name: "Test on push"
on:
  push:
  pull_request:

jobs:
  Run-composer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: iconv
          tools: composer, rector
          coverage: pcov
        env:
          fail-fast: true

      - name: Setup Nodejs
        uses: actions/setup-node@v2
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install npm
        run: npm ci

      - name: Build NPM
        run: npm run build

      - name: Test NPM
        run: npm run test

      - name: Install
        run: composer install

      - name: Run composer test
        run: composer run test
